[project]
name = "fleet-copilot"
version = "0.1.0"
description = "Agentic fleet copilot for IT admins over device telemetry"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "pydantic>=2.7",
    "langchain-google-genai>=4.5.0",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
fleet-copilot = "fleet_copilot.cli:main"
fleet-copilot-web = "fleet_copilot.web:main"
fleet-copilot-briefing = "fleet_copilot.insights:main"

[dependency-groups]
dev = ["pytest>=8", "langgraph-cli[inmem]>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
